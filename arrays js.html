<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=["HTML","CSS","JavaScript","python"]
        document.write(a[0]);//accesing array of first element 
        document.write(a[2]);//accessing array of second element
        document.write(a[a.length-1]);//accesing the last element in the array
        a[1]="AI"
        document.write(a);//changing an array
        let b=["AI","PYTHON","DATA","DEEPU"]
        //adding an elemnet to end in array by using push method
         b.push("IRFUU")
         document.write(b);
        //adding an element to start in array bu suing unshift method
         b.unshift("deepu")
        document.write(b)
        //removing an element of last in array we use pop method
        b.pop()
        document.write(b)
        //removing an elemnt of first in array we use shift method
        b.shift()
        document.write(b)


        
    </script>
</body>
</html>
