<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let pin=123;
        let user;
        do{
             user=prompt("Enter a pin")
             if(user==pin){
                document.write("successfully",pin);
            }

        }while(user!=pin);
        
    </script>
</body>
</html>
